<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
<h:head>
	<link type="text/css" rel="stylesheet" href="css/bootstrap.min.css" />
	<meta charset="UTF-8" />
</h:head>
<h:body>
	<ui:composition template="Template.xhtml">
		<ui:define name="conteudoCentral">		
			<h:form >
			 	<p:growl id="growl" life="2000" />
				<p:dataTable var="midia" value="#{mMidiaBean.midias}">
					<p:column>
						<f:facet name="header">Id</f:facet>
						<h:outputText value="#{midia.id}"/>
					</p:column>

					<p:column>
						<f:facet name="header">Titulo</f:facet>
						<h:outputText value="#{midia.titulo}"/>
					</p:column>

					<p:column>
						<f:facet name="header">Tipo</f:facet>
						<h:outputText value="#{midia.tipoMidia}"/>							
					</p:column>
					
					<p:column>
						<f:facet name="header">Genero</f:facet>
						<h:outputText value="#{midia.genero.nome}"/>							
					</p:column>

					<p:column>
						<f:facet name="header">Midia disponivel</f:facet>
						<h:outputText value="#{midia.midiaAlugada}"/>
					</p:column>
					
					<p:column>
						<f:facet name="header">Remover</f:facet>
						<p:commandButton value="Remover" action="#{mMidiaBean.removerMidia(midias)}" />
					</p:column>
				</p:dataTable>
			</h:form>
		</ui:define>
	</ui:composition>
</h:body>
</html>
